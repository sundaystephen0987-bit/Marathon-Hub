<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo"><span class="logo-mark" id="logoMark"></span><span id="siteName"></span></a>
  </header>

  <main class="container auth-wrap">
    <div class="auth-card">
      <div class="tabs">
        <button type="button" id="tabLogin" class="tab active">Log in</button>
        <button type="button" id="tabSignup" class="tab">Create account</button>
      </div>

      <p id="message" class="message" role="status" aria-live="polite"></p>

      <form id="loginForm">
        <label>Email <input type="email" id="loginEmail" autocomplete="email" required /></label>
        <label>Password <input type="password" id="loginPassword" autocomplete="current-password" required /></label>
        <button class="btn" type="submit">Log in</button>
      </form>

      <form id="signupForm" hidden>
        <label>Preferred name <input type="text" id="signupName" autocomplete="nickname" maxlength="60" required /></label>
        <label>Email <input type="email" id="signupEmail" autocomplete="email" required /></label>
        <label>Password (at least 8 characters)
          <input type="password" id="signupPassword" autocomplete="new-password" minlength="8" required />
        </label>
        <button class="btn" type="submit">Create account</button>
      </form>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
  </html>
